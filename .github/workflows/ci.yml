name: CI

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run ShellCheck
        run: shellcheck log4u

  test:
    name: Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Bats
        run: sudo apt-get update && sudo apt-get install --yes bats

      - name: Run tests
        run: bats test

  release:
    name: Release
    if: github.ref_type == 'tag'
    needs:
      - lint
      - test
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "log4u ${GITHUB_REF_NAME}"
