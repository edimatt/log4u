name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck

      - name: Lint POSIX shell library
        run: shellcheck --shell=sh log4u

  test:
    name: Bats
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install bats-core and test shells
        run: |
          npm install --global bats@1.14.0
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends dash ksh

      - name: Run behavioral tests
        run: bats test
